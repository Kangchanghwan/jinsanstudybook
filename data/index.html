<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 탐구실 | 진산 스터디북</title>
<meta name="description" content="기상자료개방포털, KOSIS, 공공데이터포털에서 모은 30개 탐구 데이터. 구글 시트로 열어 정리하고 차트로 해석해 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data.css?v=3">
</head>
<body>
  <header class="top">
    <a class="home" href="../">&larr; 진산 스터디북</a>
  </header>

  <section class="hero">
    <span class="badge">데이터와 문제 해결</span>
    <h1>데이터 탐구실</h1>
    <p class="lead">궁금한 질문을 하나 고르고, 진짜 데이터로 답을 찾아 보세요</p>
    <ol class="steps">
      <li><b>1</b>질문 고르기</li>
      <li><b>2</b>데이터 열기</li>
      <li><b>3</b>다듬고 정리하기</li>
      <li><b>4</b>차트로 나타내기</li>
      <li><b>5</b>의미 해석하기</li>
    </ol>
    <div class="all-sheet" id="allSheet" hidden>
      <a class="btn btn-green" id="allSheetLink" target="_blank" rel="noopener">전체 데이터 한꺼번에 보기</a>
    </div>
  </section>

  <nav class="filters" id="filters">
    <button class="chip on" data-site="">전체</button>
    <button class="chip" data-site="기상자료개방포털">기상자료개방포털</button>
    <button class="chip" data-site="KOSIS 국가통계포털">KOSIS 국가통계포털</button>
    <button class="chip" data-site="공공데이터포털">공공데이터포털</button>
    <button class="chip chip-jinsan" data-site="진산중학교">우리 학교 (진산중)</button>
  </nav>

  <main class="topic-grid" id="grid"><p class="loading">불러오는 중...</p></main>

  <footer>진산중학교 · 진산 스터디북 · 데이터 출처는 각 주제 페이지에 적혀 있어요</footer>

<script>
const SITE_CLASS = {'기상자료개방포털':'s-kma','KOSIS 국가통계포털':'s-kosis','공공데이터포털':'s-data','진산중학교':'s-jinsan'};
let TOPICS = [];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(site){
  const g = document.getElementById('grid');
  const list = TOPICS.filter(t=>!site || t.site===site);
  g.innerHTML = list.map(t=>`
    <a class="topic ${SITE_CLASS[t.site]||''}" href="topic.html?id=${t.id}">
      <span class="num">${t.id}</span>
      <span class="site">${esc(t.site)}</span>
      <h2>${esc(t.question)}</h2>
      <p class="meta">${esc(t.region)} · ${esc(t.period)}</p>
    </a>`).join('') || '<p class="loading">주제가 없어요</p>';
}
fetch('topics.json?v=3').then(r=>r.json()).then(d=>{
  TOPICS = d.topics;
  if (d.sheet_url){ document.getElementById('allSheet').hidden=false; document.getElementById('allSheetLink').href=d.sheet_url; }
  render('');
});
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  render(b.dataset.site);
});
</script>
</body>
</html>
