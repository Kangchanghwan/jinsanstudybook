<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>설문 참여 현황 | 데이터 탐구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data.css?v=6">
</head>
<body>
<main class="dash">
  <div class="dhead">
    <h1 style="font-size:44px">설문 참여 현황</h1>
    <div class="stat" id="stat">불러오는 중...</div>
  </div>
  <div class="dhead">
    <div class="legend"><span><i style="background:var(--green)"></i>제출</span><span><i style="background:var(--yellow)"></i>2번 이상 제출</span><span><i style="background:#e4e1d8"></i>아직</span></div>
    <div class="actions" style="margin:0">
      <button class="btn btn-white" id="back" type="button" hidden>&larr; 전체 반</button>
      <button class="btn btn-green" id="xlsOne" type="button" hidden>이 반 엑셀 받기</button>
      <button class="btn btn-green" id="xlsAll" type="button">전체 반 엑셀 받기</button>
    </div>
  </div>
  <section id="view"></section>
  <p class="hint small" id="note">10초마다 자동으로 새로고침해요. 32번까지 모두 보여 주니, 반에 없는 번호는 선생님이 판단해 주세요.</p>
</main>
<script src="config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
var C = window.SURVEY_CONFIG, $ = function(id){ return document.getElementById(id); };
var q = new URLSearchParams(location.search);
if (q.get('key')) { localStorage.setItem('jsurvey.key', q.get('key')); q.delete('key'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
var KEY = localStorage.getItem('jsurvey.key') || '';
var S = null, cur = +(new URLSearchParams(location.search).get('cls')) || 0;
function el(t, c, txt){ var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
function cnt(o){ return Object.keys(o || {}).length; }
function render(){
  if (!S) return;
  var v = $('view'); v.innerHTML = '';
  var total = 0; for (var c = 1; c <= C.CLASS_COUNT; c++) total += cnt(S.classes[c]);
  var dl = Math.ceil((new Date(C.DEADLINE) - new Date()) / 864e5);
  $('stat').textContent = '전체 ' + total + '명 제출 · ' + (S.open ? (dl >= 0 ? '마감 D-' + dl : '') : '설문 닫힘') + ' · ' + new Date(S.updated).toLocaleTimeString('ko-KR');
  $('back').hidden = !cur; $('xlsOne').hidden = !cur || !KEY; $('xlsAll').hidden = !!cur || !KEY;
  if (!cur) {
    var g = el('div', 'cgrid');
    for (var c = 1; c <= C.CLASS_COUNT; c++) (function(c){
      var m = S.classes[c] || {}, n = cnt(m), card = el('button', 'ccard'); card.type = 'button';
      var h = el('h3', null, c + '반'); h.appendChild(el('small', null, n + ' / ' + C.MAX_NUM)); card.appendChild(h);
      var bar = el('div', 'bar'), fill = el('i'); fill.style.width = Math.min(100, n / C.MAX_NUM * 100) + '%'; bar.appendChild(fill); card.appendChild(bar);
      var d = el('div', 'dots');
      for (var k = 1; k <= C.MAX_NUM; k++) d.appendChild(el('span', m[k] > 1 ? 'x' : m[k] ? 'd' : '', k));
      card.appendChild(d);
      card.onclick = function(){ cur = c; history.replaceState(null, '', '?cls=' + c); render(); };
      g.appendChild(card);
    })(c);
    v.appendChild(g);
  } else {
    var m = S.classes[cur] || {}, n = cnt(m), miss = [];
    for (var k = 1; k <= C.MAX_NUM; k++) if (!m[k]) miss.push(k);
    v.appendChild(el('h2', null, C.GRADE + '학년 ' + cur + '반  ' + n + '명 제출'));
    v.lastChild.style.cssText = "font-family:'Black Han Sans';font-weight:400;font-size:48px";
    var bg = el('div', 'big-grid');
    for (var k = 1; k <= C.MAX_NUM; k++) bg.appendChild(el('span', m[k] > 1 ? 'x' : m[k] ? 'd' : '', k));
    v.appendChild(bg);
    v.appendChild(el('p', 'big', '아직 안 낸 번호: ' + (miss.join(', ') || '없음')));
  }
}
function load(){
  fetch(C.API_URL + '?action=status&t=' + Date.now()).then(function(r){ return r.json(); }).then(function(s){ if (s.ok) { S = s; render(); } }).catch(function(){ $('stat').textContent = '불러오지 못했어요. 잠시 뒤 다시 시도해요.'; });
}
$('back').onclick = function(){ cur = 0; history.replaceState(null, '', location.pathname); render(); };
function num(v){ var n = parseFloat(v); return isFinite(n) && /^-?[\d.]+$/.test(String(v).trim()) ? n : v; }
function time(v){ var m = /(\d{1,2}):(\d{2})/.exec(v || ''); return m ? (+m[1] + +m[2] / 60) / 24 : v; }
function sheetFor(c){
  return fetch(C.API_URL + '?action=export&cls=' + c + '&key=' + encodeURIComponent(KEY)).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error);
    var aoa = [j.header].concat(j.rows.map(function(r){ return [r[0], num(r[1]), time(r[2]), r[3], num(r[4])]; }));
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    for (var i = 2; i <= aoa.length; i++) { var a = ws['C' + i]; if (a && typeof a.v === 'number') a.z = 'hh:mm'; }
    ws['!cols'] = [{ wch: 10 }, { wch: 16 }, { wch: 14 }, { wch: 28 }, { wch: 24 }];
    return ws;
  });
}
function save(list, fname){
  var wb = XLSX.utils.book_new();
  return list.reduce(function(p, c){ return p.then(function(){ return sheetFor(c).then(function(ws){ XLSX.utils.book_append_sheet(wb, ws, c + '반'); }); }); }, Promise.resolve())
    .then(function(){ XLSX.writeFile(wb, fname); }).catch(function(e){ alert('엑셀을 만들지 못했어요: ' + e.message); });
}
$('xlsOne').onclick = function(){ save([cur], C.GRADE + '학년_' + cur + '반_스마트폰과수면_설문.xlsx'); };
$('xlsAll').onclick = function(){ var l = []; for (var c = 1; c <= C.CLASS_COUNT; c++) l.push(c); save(l, C.GRADE + '학년_전체반_스마트폰과수면_설문.xlsx'); };
load(); setInterval(load, 10000);
})();
</script>
</body>
</html>
